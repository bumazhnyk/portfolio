<style>

*,*::before,*::after{box-sizing:border-box}

.tl::after{content:"";position:absolute;top:0;bottom:0;width:3px;left:0;background:var(--o1);box-shadow:0 0 14px var(--o1);animation:ph 10s linear infinite}

.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(380px circle at var(--mx,-999px) var(--my,-999px),rgba(255,106,0,.2),transparent 62%)}

    const pr=e.play();if(pr&&pr.catch)pr.catch(err=>{if(err&&err.name==="NotAllowedError"){e.muted=true;e.play().then(()=>{sb.hidden=false}).catch(()=>{})}})}
  else if(v.embed){const e=document.createElement("iframe");e.src=v.embed;e.allow="autoplay; fullscreen";e.allowFullscreen=true;screen.appendChild(e)}
  else screen.textContent=T[L].watch;
}
$("close").onclick=()=>dlg.close();dlg.addEventListener("close",()=>{screen.innerHTML="";cur=null});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lang",L)}catch(e){}render()});
let rvReady=false;
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12}):null;
function rv(el,i,L){el.classList.add("rv");el.style.setProperty("--dx",(L||!(i%2)?"-":"")+(L?"150":"110")+"px");el.style.setProperty("--d",(L?i*.2:(i%3)*.08)+"s");if(rvReady||!io)el.classList.add("in");else io.observe(el)}
function staticRv(){[".two .box",".tools span",".rfeat",".rcard",".contact"].forEach(s=>document.querySelectorAll(s).forEach((el,i)=>rv(el,i)))}
const root=document.documentElement,mt=document.querySelector('meta[name="theme-color"]');
function setTheme(t,save){root.dataset.theme=t;if(mt)mt.content=t==="light"?"#e8f2fe":"#070707";if(save){try{localStorage.setItem("theme",t)}catch(e){}}}
setTheme(root.dataset.theme==="light"?"light":"dark",false);
$("theme").onclick=()=>setTheme(root.dataset.theme==="light"?"dark":"light",true);
staticRv();render();rvReady=true;
/* анимации: таймкод, свет за курсором, параллакс больших слов */
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
if(!calm){
  
  addEventListener("pointermove",e=>{const s=document.documentElement.style;s.setProperty("--mx",e.clientX+"px");s.setProperty("--my",e.clientY+"px")},{passive:true});
  const gs=[...document.querySelectorAll(".ghost")];let tick=false;
  const par=()=>{gs.forEach(g=>{const r=g.parentElement.getBoundingClientRect();g.style.transform="translateX("+(-r.top*parseFloat(g.dataset.sp)*.6)+"px)"});tick=false};
  addEventListener("scroll",()=>{if(!tick){tick=true;requestAnimationFrame(par)}},{passive:true});par();
}
</script>
